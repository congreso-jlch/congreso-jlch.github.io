<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>III Congreso de la Asociación de Jóvenes Lingüistas de Chile 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-lila: #9282ac;
            --color-verde: #b6bb69;
            --color-crema: #f9f6e5;
            --color-oscuro: #261e2d; 
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--color-lila);
            background-image: radial-gradient(rgba(38, 30, 45, 0.12) 1px, transparent 0),
                              linear-gradient(rgba(249, 246, 229, 0.04) 1px, transparent 0);
            background-size: 20px 20px, 40px 40px;
            color: var(--color-crema);
            font-family: 'Montserrat', sans-serif;
            line-height: 1.6;
        }

        /* Navegación Responsiva */
        header {
            position: sticky;
            top: 0;
            background-color: var(--color-oscuro);
            border-bottom: 4px solid var(--color-verde);
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            flex-wrap: wrap; /* Permite que baje en celulares */
        }

        .logo-texto {
            font-weight: 700;
            font-size: 1rem;
            color: var(--color-crema);
            text-transform: uppercase;
            text-decoration: none;
            letter-spacing: 0.5px;
        }

        .nav-menu {
            display: flex;
            list-style: none;
            gap: 25px;
            flex-wrap: wrap; /* Si no cabe en pantallas medianas, se acomoda solo */
        }

        .nav-menu a {
            text-decoration: none;
            color: var(--color-crema);
            font-size: 0.85rem;
            font-weight: 600;
            transition: color 0.2s;
            display: inline-block;
            padding: 5px 0;
        }

        .nav-menu a:hover {
            color: var(--color-verde);
        }

        /* Banner Superior */
        .hero-banner-full {
            width: 100%;
            background-color: var(--color-oscuro);
            line-height: 0;
        }

        .hero-img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Sección de Fecha Destacada */
        .fecha-hero {
            background-color: var(--color-verde);
            color: var(--color-oscuro);
            text-align: center;
            padding: 40px 20px;
            font-weight: 700;
            box-shadow: inset 0 -5px 15px rgba(0,0,0,0.1);
        }

        .fecha-hero h2 {
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 5px;
            text-shadow: 1px 1px 0px rgba(255,255,255,0.2);
        }

        .fecha-hero p {
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* Contenedores de Información Ampliados */
        .container {
            max-width: 1150px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .card-academica {
            background-color: #261e2d; 
            border: 1px solid rgba(249, 246, 229, 0.1);
            border-radius: 12px;
            padding: 45px;
            margin-bottom: 40px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            transition: border-color 0.3s ease;
        }

        .card-academica:hover {
            border-color: rgba(182, 187, 105, 0.3);
        }

        .titulo-seccion {
            font-size: 1.6rem;
            text-transform: uppercase;
            border-left: 6px solid var(--color-verde);
            padding-left: 15px;
            margin-bottom: 25px;
            color: var(--color-crema);
            letter-spacing: 0.5px;
        }

        p {
            margin-bottom: 15px;
            font-size: 1rem;
        }

        /* Flexbox Responsivo */
        .convocatoria-flex {
            display: flex;
            gap: 35px;
            align-items: stretch;
        }

        .columna-mitad {
            flex: 1;
            width: 50%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Contenedor responsivo para tablas */
        .table-responsive {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            margin: 15px 0;
        }

        /* Botones de acción adaptables */
        .botones-wrapper {
            display: flex; 
            gap: 15px; 
            width: 100%;
            flex-wrap: wrap; /* Se apilan si la pantalla es muy chica */
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 14px 24px;
            border-radius: 4px;
            font-weight: 700;
            text-decoration: none;
            transition: background-color 0.2s, transform 0.1s;
            border: none;
            cursor: pointer;
            font-size: 0.95rem;
            flex: 1;
            min-width: 180px; /* Evita que queden excesivamente colapsados */
            text-align: center;
        }

        .btn-verde { 
            background-color: var(--color-verde); 
            color: var(--color-oscuro); 
        }
        .btn-verde:hover { 
            background-color: var(--color-crema); 
        }
        
        .btn-crema { 
            background-color: var(--color-crema); 
            color: var(--color-oscuro); 
        }
        .btn-crema:hover { 
            background-color: var(--color-verde); 
        }

        /* Botón de pago transitorio deshabilitado */
        .btn-deshabilitado {
            display: inline-block;
            padding: 15px 40px;
            background-color: rgba(249, 246, 229, 0.15);
            color: rgba(249, 246, 229, 0.4);
            text-decoration: none;
            border-radius: 4px;
            font-weight: 700;
            font-size: 1rem;
            text-align: center;
            border: 1px solid rgba(249, 246, 229, 0.1);
            cursor: not-allowed;
            width: 100%;
        }

        .aviso-proximamente {
            background-color: rgba(182, 187, 105, 0.12);
            border: 1px dashed var(--color-verde);
            color: var(--color-verde);
            padding: 15px;
            border-radius: 4px;
            font-size: 0.95rem;
            font-weight: 600;
            text-align: center;
            margin-bottom: 20px;
        }

        /* Acordeón de Áreas Temáticas */
        .eje-box {
            background-color: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(249, 246, 229, 0.08);
            margin-bottom: 10px;
            border-radius: 6px;
            overflow: hidden;
        }

        .eje-box:hover {
            background-color: rgba(255, 255, 255, 0.05);
        }

        .eje-btn {
            padding: 18px 25px;
            width: 100%;
            text-align: left;
            background: none;
            border: none;
            color: var(--color-crema);
            font-family: inherit;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        /* Animación para la flechita del acordeón */
        .eje-btn span {
            transition: transform 0.3s ease;
            font-size: 0.8rem;
        }

        .eje-box.activo .eje-btn span {
            transform: rotate(180deg);
        }

        .eje-content {
            display: none; 
            padding: 0 25px 20px 25px;
            font-size: 0.95rem;
            color: rgba(249, 246, 229, 0.85);
            border-top: 1px solid rgba(249, 246, 229, 0.05);
            background-color: rgba(0, 0, 0, 0.15);
        }

        .eje-content p {
            margin-top: 10px;
            margin-bottom: 5px;
        }

        /* Tablas */
        table { 
            width: 100%; 
            border-collapse: collapse; 
        }
        th, td { 
            padding: 14px 15px; 
            text-align: left; 
            border-bottom: 1px solid rgba(255,255,255,0.08); 
        }
        th {
